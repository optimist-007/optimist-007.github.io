<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="Abstract research collage showing materials, interfaces, devices and scientific questions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6f1"/>
      <stop offset="1" stop-color="#e9eee8"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ea99a"/>
      <stop offset=".55" stop-color="#496c58"/>
      <stop offset="1" stop-color="#244636"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#20372b" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="900" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="690" cy="145" r="115" fill="#c8d2c6" opacity=".72"/>
  <circle cx="725" cy="475" r="92" fill="#dccdb4" opacity=".56"/>
  <path d="M56 90 C175 34 279 57 340 118" fill="none" stroke="#a96049" stroke-width="2" opacity=".42"/>
  <path d="M70 524 C165 456 238 472 310 531" fill="none" stroke="#28483a" stroke-width="2" opacity=".38"/>

  <!-- molecular network -->
  <g stroke="#526b5e" stroke-width="2" opacity=".55" fill="#f8f6f1">
    <line x1="118" y1="165" x2="184" y2="125"/>
    <line x1="184" y1="125" x2="247" y2="173"/>
    <line x1="247" y1="173" x2="201" y2="238"/>
    <line x1="201" y1="238" x2="132" y2="224"/>
    <line x1="132" y1="224" x2="118" y2="165"/>
    <circle cx="118" cy="165" r="9"/><circle cx="184" cy="125" r="9"/><circle cx="247" cy="173" r="9"/><circle cx="201" cy="238" r="9"/><circle cx="132" cy="224" r="9"/>
  </g>

  <!-- crystal -->
  <g filter="url(#shadow)">
    <path d="M388 405 L430 176 L531 111 L602 254 L540 486 Z" fill="url(#crystal)"/>
    <path d="M430 176 L510 214 L602 254 L531 111 Z" fill="#9db4a8" opacity=".65"/>
    <path d="M430 176 L488 297 L540 486 L388 405 Z" fill="#345946" opacity=".7"/>
    <path d="M488 297 L602 254 L540 486 Z" fill="#567c65" opacity=".78"/>
    <path d="M510 214 L488 297" stroke="#d9e1db" stroke-width="3" opacity=".65"/>
  </g>

  <!-- leaves -->
  <g fill="#486a56" opacity=".9">
    <path d="M611 192 C692 151 759 170 806 228 C724 239 662 224 611 192 Z"/>
    <path d="M625 214 C675 255 684 330 650 376 C610 321 603 264 625 214 Z"/>
    <path d="M715 358 C793 334 846 365 864 419 C800 430 752 407 715 358 Z"/>
  </g>
  <g stroke="#d7e0d8" stroke-width="2" opacity=".75">
    <path d="M623 196 C691 201 742 211 793 228"/>
    <path d="M635 225 C650 267 653 316 650 361"/>
    <path d="M730 366 C773 386 815 402 850 414"/>
  </g>

  <!-- spectrum / device trace -->
  <g transform="translate(555 42)">
    <rect width="270" height="108" rx="10" fill="#f8f6f1" stroke="#28483a" stroke-opacity=".18"/>
    <path d="M18 86 H252" stroke="#69716b" stroke-width="1"/>
    <path d="M20 78 C52 77 58 77 78 75 C92 74 95 16 104 16 C113 16 114 73 126 73 C141 73 149 65 157 64 C169 62 176 55 185 55 C199 55 208 78 248 77" fill="none" stroke="#a96049" stroke-width="2.5"/>
    <text x="18" y="25" font-family="DM Mono, monospace" font-size="10" letter-spacing="2" fill="#28483a">SIGNAL / RESPONSE</text>
  </g>

  <!-- handwritten-style label -->
  <text x="56" y="326" font-family="Georgia, serif" font-size="29" font-style="italic" fill="#28483a">materials</text>
  <text x="56" y="360" font-family="Georgia, serif" font-size="25" font-style="italic" fill="#a96049">interfaces</text>
  <text x="56" y="392" font-family="Georgia, serif" font-size="25" font-style="italic" fill="#28483a">devices</text>
  <text x="56" y="424" font-family="Georgia, serif" font-size="25" font-style="italic" fill="#a96049">questions</text>

  <text x="660" y="526" font-family="DM Mono, monospace" font-size="11" letter-spacing="2" fill="#28483a">UNDERSTAND · TEST · IMPROVE</text>
</svg>