<style>
/* Media page: compact, consistent cards with no forced cropping */
.media-showcase{padding:28px 0 42px!important}
.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#gallery.media-grid{display:block}
#videos.media-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

#gallery .media-institution-group{min-width:0;margin:0}
#gallery .media-institution-group+.media-institution-group{margin-top:24px}
#gallery .media-institution-heading{
  margin:0 0 12px!important;
  padding:0 0 9px;
  border-bottom:1px solid var(--line);
  color:var(--forest);
  font-family:var(--serif);
  font-size:clamp(1.7rem,2.4vw,2.2rem)!important;
  font-weight:500;
  line-height:1.08!important;
  letter-spacing:-.025em!important;
  text-transform:none;
  overflow-wrap:anywhere
}
#gallery .media-group-images{
  display:grid!important;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr))!important;
  gap:14px!important;
  align-items:start;
  justify-content:start;
  min-width:0
}
#gallery .media-card,
#gallery .media-card:nth-child(3n+1),
#gallery .media-card:nth-child(3n+2){
  grid-column:auto!important;
  width:100%!important;
  max-width:none!important;
  min-width:0;
  margin:0;
  padding:10px!important;
  background:rgba(251,248,240,.78)!important;
  border:1px solid var(--line)!important;
  box-shadow:none!important;
  overflow:hidden
}
#gallery .media-card:after{content:none!important;display:none!important}
#gallery .media-card:hover{transform:none!important;box-shadow:none!important}
#gallery .media-image-card{display:flex;flex-direction:column;align-items:stretch;gap:0}
#gallery .media-image-wrap{
  width:100%;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--paper)
}
#gallery .media-image-wrap img,
#gallery .media-card img,
#gallery .media-image-card .media-image-wrap img{
  display:block!important;
  width:100%!important;
  height:100%!important;
  max-width:100%!important;
  max-height:none!important;
  aspect-ratio:auto!important;
  object-fit:contain!important;
  object-position:center!important;
  transform:none!important;
  margin:0!important;
  border:0!important
}
#gallery .media-image-card .media-copy{min-width:0;padding:10px 2px 1px}
#gallery .media-category{
  display:block;
  margin:0 0 5px;
  color:var(--clay);
  font:600 .64rem/1.4 var(--mono)!important;
  letter-spacing:.1em;
  text-transform:uppercase
}
#gallery .media-card h3{
  margin:0 0 6px!important;
  color:var(--forest);
  font-family:var(--serif)!important;
  font-size:1.45rem!important;
  font-weight:500;
  line-height:1.12!important;
  letter-spacing:-.025em!important;
  overflow-wrap:anywhere
}
#gallery .media-card p{
  margin:0!important;
  color:var(--muted);
  font-size:.87rem!important;
  line-height:1.5!important;
  overflow-wrap:anywhere
}

/* Keep the future video section tidy without changing how videos are loaded. */
#videos .media-card{min-width:0;padding:12px;background:rgba(251,248,240,.78);border:1px solid var(--line);box-shadow:none}
#videos .media-card:after{content:none!important;display:none!important}
#videos .media-card h3{font-size:1.35rem!important;line-height:1.15!important;margin:8px 0!important}
#videos .media-card p{font-size:.9rem!important;line-height:1.55!important}
#videos .media-card video{display:block;width:100%;max-height:420px;object-fit:contain;background:var(--paper)}

@media(max-width:900px){
  #gallery .media-group-images{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))!important;gap:12px!important}
  #gallery .media-image-wrap{height:175px}
}
@media(max-width:560px){
  .media-grid{grid-template-columns:1fr}
  #gallery .media-institution-group+.media-institution-group{margin-top:20px}
  #gallery .media-group-images{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
  #gallery .media-card,
  #gallery .media-card:nth-child(3n+1),
  #gallery .media-card:nth-child(3n+2){padding:7px!important}
  #gallery .media-image-wrap{height:135px}
  #gallery .media-image-card .media-copy{padding:8px 1px 1px}
  #gallery .media-card h3{font-size:1.08rem!important;line-height:1.15!important}
  #gallery .media-card p{font-size:.78rem!important;line-height:1.45!important}
  #gallery .media-category{font-size:.57rem!important}
  #videos.media-grid{grid-template-columns:1fr}
}
</style>
</head>

<main>
<div class="wrap page-hero">
<div><a class="backlink" href="index.html">← Home</a><div class="eyebrow">Visual archive</div>
<h1>Research media.</h1>
</div>

</div>

<section class="section media-showcase"><div class="wrap">
<div class="eyebrow">Images</div>
<div class="media-grid" id="gallery"></div>
<div style="margin-top:34px"><div class="eyebrow">Video</div>
<div class="media-grid" id="videos"></div></div>
</div></section>
</main>
<footer class="wrap site-footer"><span>Visual research archive</span><a href="creative.html">Creative side ↗</a></footer>

<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function imageCard(x){
 const src=x.path||x.image||x.src||x.url||'';
 if(!src)return '';

 return '<article class="media-card media-image-card">'+
   '<div class="media-image-wrap">'+
     '<img src="'+esc(src)+'" '+
     'alt="'+esc(x.alt||x.caption||x.title||'Research image')+'" '+
     'loading="lazy">'+
   '</div>'+
   '<div class="media-copy">'+
     (x.category?'<div class="media-category">'+esc(x.category)+'</div>':'')+
     '<h3>'+esc(x.name||x.title||'Research image')+'</h3>'+
     (x.caption?'<p class="media-caption">'+esc(x.caption)+'</p>':'')+
   '</div>'+
 '</article>';
}
function videoCard(x){
 const src=x.video||x.src||x.url||x.link||'';
 if(!src)return '';
 const isEmbed=/youtube\.com|youtu\.be|vimeo\.com/.test(src);
 return '<article class="media-card"><div class="media-kind">Video</div>'+
 (isEmbed?'<p style="padding:35px 0"><a href="'+esc(src)+'" target="_blank" rel="noopener">Watch video ↗</a></p>':'<video controls preload="metadata" src="'+esc(src)+'"></video>')+
 '<h3>'+esc(x.title||'Video note')+'</h3>'+(x.description||x.caption?'<p>'+esc(x.description||x.caption)+'</p>':'')+'</article>';
}
function institutionGroups(items){
 const groups=new Map();

 items.forEach(item=>{
  const institution=String(
   item.institution||item.organization||item.institutionName||''
  ).trim()||'Institution not specified';

  if(!groups.has(institution))groups.set(institution,[]);
  groups.get(institution).push(item);
 });

 return Array.from(groups,([institution,groupItems])=>
  '<section class="media-institution-group">'+
    '<h2 class="media-institution-heading">'+esc(institution)+'</h2>'+
    '<div class="media-group-images">'+
      groupItems.map(imageCard).join('')+
    '</div>'+
  '</section>'
 ).join('');
}

async function load(){
 try{
  const [m,c]=await Promise.all([
   fetch('content/media-library.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():[]),
   fetch('content/creative-content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{})
  ]);
  const images=Array.isArray(m)?m:(Array.isArray(m.images)?m.images:[]);
  const creative=Array.isArray(c.mediaEntries)?c.mediaEntries:[];
  const posts=Array.isArray(c.posts)?c.posts:[];
  const allImages=images.concat(
   creative.filter(x=>x.enabled!==false&&x.image).map(x=>({
    image:x.image,title:x.title,alt:x.alt,caption:x.text,
    institution:x.institution||x.organization||x.institutionName||''
   }))
  );
  const allVideos=creative.filter(x=>x.enabled!==false&&x.video).map(x=>({
   video:x.video,title:x.title,caption:x.text
  }));
  posts.forEach(p=>(p.media||[]).forEach(x=>{
   if(x.type==='image'&&x.src)allImages.push({
    image:x.src,title:p.title,alt:x.alt,caption:x.caption,
    institution:x.institution||x.organization||p.institution||p.organization||''
   });
   if(x.type==='video'&&x.src)allVideos.push({
    video:x.src,title:p.title,caption:x.caption
   });
  }));
  document.getElementById('gallery').innerHTML=
   institutionGroups(allImages)||'';
  document.getElementById('videos').innerHTML=allVideos.map(videoCard).join('')||'';
 }catch(e){
  document.getElementById('gallery').innerHTML='';
  document.getElementById('videos').innerHTML='';
 }
}
load();
</script>
<script src="assets/site-interactions.js?v=1" defer></script>
