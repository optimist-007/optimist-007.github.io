<style>
.media-showcase{padding:0 0 42px}
.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#gallery.media-grid{grid-template-columns:1fr}
.media-institution-group{grid-column:1/-1;min-width:0}
.media-institution-group+.media-institution-group{margin-top:36px}
.media-institution-heading{margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid rgba(36,41,35,.16);font-size:1.25rem;line-height:1.4;letter-spacing:.025em;color:#37624f;overflow-wrap:anywhere}
.media-group-images{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;min-width:0}
.media-card{background:#f8f7f3;border:1px solid rgba(36,41,35,.12);padding:10px;box-shadow:0 8px 20px rgba(36,41,35,.06);min-width:0}
.media-card img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:auto;object-fit:contain;margin-inline:auto}
.media-card video{width:100%;display:block;max-height:520px;object-fit:contain;background:#ece9e2}
.media-image-wrap{height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.media-image-wrap img{flex:0 1 auto}
.media-card h3{font-size:.98rem;line-height:1.4;margin:7px 0 5px;overflow-wrap:anywhere}
.media-card p{font-size:.88rem;margin:0;color:#667069;line-height:1.55;overflow-wrap:anywhere}
.media-image-card{display:flex;flex-direction:column;align-items:stretch;gap:0}
.media-image-wrap{min-width:0;background:#ece9e2}
.media-image-card .media-image-wrap img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
 /* Override the shared stylesheet's global object-fit:cover and forced 4:3 ratio.
    Keep the whole photograph visible, including faces and edges. */
#gallery .media-image-wrap{height:220px!important;overflow:hidden}
#gallery .media-image-wrap img,
#gallery .media-image-card .media-image-wrap img{
  display:block!important;
  width:100%!important;
  height:100%!important;
  max-width:100%!important;
  max-height:none!important;
  aspect-ratio:auto!important;
  object-fit:contain!important;
  object-position:center center!important;
  transform:none!important;
}
#gallery .media-card:hover img{transform:none!important}
.media-image-card .media-copy{min-width:0;padding:10px 2px 2px}
.media-image-card .media-caption{line-height:1.7}
.media-category{display:inline-block;align-self:flex-start;margin:0 0 8px;font:600 .66rem/1.4 "DM Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:#37624f}
.media-kind{font:600 .68rem/1.2 "DM Mono",monospace;text-transform:uppercase;letter-spacing:.12em;color:#37624f}
.media-empty{padding:35px 0;color:#667069}
@media(max-width:1000px){
  .media-group-images{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .media-grid{grid-template-columns:1fr}
  .media-group-images{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .media-card{padding:8px}
  #gallery .media-image-wrap{height:160px!important}
  #gallery .media-image-wrap img,
  #gallery .media-image-card .media-image-wrap img{
    width:100%!important;
    height:100%!important;
    max-width:100%!important;
    max-height:none!important;
    aspect-ratio:auto!important;
    object-fit:contain!important;
    object-position:center center!important;
  }
  .media-image-card .media-copy{padding:8px 1px 1px}
  .media-card h3{font-size:.9rem}
  .media-card p{font-size:.82rem;line-height:1.45}
}

/* Compact institution gallery: cards stay small and fill available slots as photos are added. */
#gallery .media-institution-group+.media-institution-group{
  margin-top:22px!important;
}
#gallery .media-institution-heading{
  margin-bottom:12px!important;
  padding-bottom:9px!important;
}
#gallery .media-group-images{
  display:grid!important;
  grid-template-columns:repeat(auto-fill,minmax(180px,220px))!important;
  gap:12px!important;
  justify-content:start!important;
  align-items:start!important;
}
#gallery .media-card,
#gallery .media-card:nth-child(3n+1),
#gallery .media-card:nth-child(3n+2){
  grid-column:auto!important;
  width:100%!important;
  max-width:220px!important;
  padding:8px!important;
  background:#f8f7f3!important;
  border:1px solid rgba(36,41,35,.12)!important;
  box-shadow:0 6px 16px rgba(36,41,35,.05)!important;
}
#gallery .media-image-wrap{
  height:170px!important;
}
#gallery .media-image-wrap img,
#gallery .media-card img,
#gallery .media-image-card .media-image-wrap img{
  display:block!important;
  width:100%!important;
  height:100%!important;
  max-width:100%!important;
  max-height:none!important;
  aspect-ratio:auto!important;
  object-fit:contain!important;
  object-position:center center!important;
  transform:none!important;
}
@media(max-width:560px){
  #gallery .media-group-images{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:10px!important;
  }
  #gallery .media-card,
  #gallery .media-card:nth-child(3n+1),
  #gallery .media-card:nth-child(3n+2){
    max-width:none!important;
    padding:7px!important;
  }
  #gallery .media-image-wrap{
    height:130px!important;
  }
}

</style>

</div>

<section class="section media-showcase"><div class="wrap">
<div class="eyebrow">Images</div>
<div class="media-grid" id="gallery"></div>
<div style="margin-top:34px"><div class="eyebrow">Video</div>
<div class="media-grid" id="videos"></div></div>
</div></section>
</main>
<footer class="wrap site-footer"><span>Visual research archive</span><a href="creative.html">Creative side ↗</a></footer>

<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function imageCard(x){
 const src=x.path||x.image||x.src||x.url||'';
 if(!src)return '';

 return '<article class="media-card media-image-card">'+
   '<div class="media-image-wrap">'+
     '<img src="'+esc(src)+'" '+
     'alt="'+esc(x.alt||x.caption||x.title||'Research image')+'" '+
     'loading="lazy">'+
   '</div>'+
   '<div class="media-copy">'+
     (x.category?'<div class="media-category">'+esc(x.category)+'</div>':'')+
     '<h3>'+esc(x.name||x.title||'Research image')+'</h3>'+
     (x.caption?'<p class="media-caption">'+esc(x.caption)+'</p>':'')+
   '</div>'+
 '</article>';
}
function videoCard(x){
 const src=x.video||x.src||x.url||x.link||'';
 if(!src)return '';
 const isEmbed=/youtube\.com|youtu\.be|vimeo\.com/.test(src);
 return '<article class="media-card"><div class="media-kind">Video</div>'+
 (isEmbed?'<p style="padding:35px 0"><a href="'+esc(src)+'" target="_blank" rel="noopener">Watch video ↗</a></p>':'<video controls preload="metadata" src="'+esc(src)+'"></video>')+
 '<h3>'+esc(x.title||'Video note')+'</h3>'+(x.description||x.caption?'<p>'+esc(x.description||x.caption)+'</p>':'')+'</article>';
}
function institutionGroups(items){
 const groups=new Map();

 items.forEach(item=>{
  const institution=String(
   item.institution||item.organization||item.institutionName||''
  ).trim()||'Institution not specified';

  if(!groups.has(institution))groups.set(institution,[]);
  groups.get(institution).push(item);
 });

 return Array.from(groups,([institution,groupItems])=>
  '<section class="media-institution-group">'+
    '<h2 class="media-institution-heading">'+esc(institution)+'</h2>'+
    '<div class="media-group-images">'+
      groupItems.map(imageCard).join('')+
    '</div>'+
  '</section>'
 ).join('');
}

async function load(){
 try{
  const [m,c]=await Promise.all([
   fetch('content/media-library.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():[]),
   fetch('content/creative-content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{})
  ]);
  const images=Array.isArray(m)?m:(Array.isArray(m.images)?m.images:[]);
  const creative=Array.isArray(c.mediaEntries)?c.mediaEntries:[];
  const posts=Array.isArray(c.posts)?c.posts:[];
  const allImages=images.concat(
   creative.filter(x=>x.enabled!==false&&x.image).map(x=>({
    image:x.image,title:x.title,alt:x.alt,caption:x.text,
    institution:x.institution||x.organization||x.institutionName||''
   }))
  );
  const allVideos=creative.filter(x=>x.enabled!==false&&x.video).map(x=>({
   video:x.video,title:x.title,caption:x.text
  }));
  posts.forEach(p=>(p.media||[]).forEach(x=>{
   if(x.type==='image'&&x.src)allImages.push({
    image:x.src,title:p.title,alt:x.alt,caption:x.caption,
    institution:x.institution||x.organization||p.institution||p.organization||''
   });
   if(x.type==='video'&&x.src)allVideos.push({
    video:x.src,title:p.title,caption:x.caption
   });
  }));
  document.getElementById('gallery').innerHTML=
   institutionGroups(allImages)||'';
  document.getElementById('videos').innerHTML=allVideos.map(videoCard).join('')||'';
 }catch(e){
  document.getElementById('gallery').innerHTML='';
  document.getElementById('videos').innerHTML='';
 }
}
load();
</script>
<script src="assets/site-interactions.js?v=1" defer></script>
