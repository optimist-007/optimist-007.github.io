<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project | Simran Sainand Revankar</title><link rel="stylesheet" href="assets/research-readable.css?v=5"><style>
#app .page-hero{padding-top:42px;padding-bottom:48px}
#app .section{padding-top:42px;padding-bottom:48px}
#app .section + .section{padding-top:34px}
#app .split-callout{gap:22px}
#app .dark-panel,#app .light-panel{padding:24px}
#app .band.section{padding-top:42px;padding-bottom:48px}
#app .hero-lead{margin-top:14px}
@media(max-width:720px){
  #app .page-hero{padding-top:28px;padding-bottom:34px}
  #app .section,#app .band.section{padding-top:30px;padding-bottom:36px}
}
</style></head><body>
<header class="site-header"><div class="wrap nav"><a class="brand" href="index.html">Simran Sainand Revankar</a><nav class="nav-links"><a class="active" href="projects.html">Projects</a><a href="blogs.html">Blogs</a>
<a href="media/docs/CV.pdf">CV ↗</a><a class="creative-link" href="creative.html">Creative side ↗</a></nav><a class="menu-note" href="creative.html">Creative side ↗</a></div></header>
<main id="app"><div class="wrap page-hero"><div><a class="backlink" href="projects.html">← Back to projects</a><div class="eyebrow">Loading project</div><h1>Opening the research story…</h1></div></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=new URLSearchParams(location.search).get('slug');
fetch('content/projects.json',{cache:'no-store'}).then(r=>r.json()).then(ps=>{
  const p=ps.find(x=>x.slug===slug)||ps[0];
  if(!p) throw new Error('No project');
  document.title=p.title+' | Research';
  const workflow=(p.workflow||[]).map(w=>'<article class="case-step"><span>'+esc(w.number||'')+'</span><div><h3>'+esc(w.title||'')+'</h3><p>'+esc(w.text||'')+'</p></div></article>').join('');
  const skills=(p.skills||[]).map(s=>'<span>'+esc(s)+'</span>').join('');
  const pub=p.publication||{};
  const publication=pub.title?'<section class="project-evidence"><div class="wrap"><div class="eyebrow">Publication</div><div class="evidence-row"><div><h2>'+esc(pub.title)+'</h2><p>'+esc(pub.journal||'')+(pub.year?' · '+esc(pub.year):'')+(pub.role?' · '+esc(pub.role):'')+'</p></div>'+(pub.link?'<a href="'+esc(pub.link)+'" target="_blank" rel="noopener">View publication ↗</a>':'')+'</div></div></section>':'';
  document.getElementById('app').innerHTML=
    '<div class="wrap page-hero project-hero"><div><div class="eyebrow">'+esc(p.kicker||'Selected research')+'</div><h1>'+esc(p.title)+'</h1><p class="hero-lead">'+esc(p.summary||'')+'</p></div><div class="project-facts"><div><span>Status</span><strong>'+esc(p.status||'')+'</strong></div>'+(p.system?'<div><span>System</span><strong>'+esc(p.system)+'</strong></div>':'')+(p.role?'<div><span>Role</span><strong>'+esc(p.role)+'</strong></div>':'')+'</div></div>'+
    '<section class="project-question"><div class="wrap"><div class="eyebrow">Research question</div><h2>'+esc(p.question||'')+'</h2></div></section>'+
    '<section class="project-workflow"><div class="wrap"><div class="project-section-head"><div class="eyebrow">Research workflow</div><p>From material development to device-level evidence.</p></div><div class="case-steps">'+workflow+'</div></div></section>'+
    '<section class="project-proof"><div class="wrap proof-grid"><div><div class="eyebrow">Skills demonstrated</div><div class="proof-skills">'+skills+'</div></div><div><div class="eyebrow">Outcome</div><p>'+esc(p.outcome||'')+'</p><div class="eyebrow reflection-label">What I took from it</div><p>'+esc(p.reflection||'')+'</p></div></div></section>'+
    publication;
}).catch(()=>{
  document.getElementById('app').innerHTML='<div class="wrap page-hero"><div><div class="eyebrow">Project unavailable</div><h1>This project page could not load.</h1></div></div>';
});
</script></script><script>
(async function renderEditableSiteNav(){
  try{
    const r=await fetch('content/main-site.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json(), nav=Array.isArray(d.nav)?d.nav:[];
    const host=document.querySelector('.nav-links')||document.querySelector('.home-navlinks');
    if(!host||!nav.length)return;
    const current=location.pathname.split('/').pop()||'index.html';
    host.innerHTML=nav.map(function(n){
      const href=String(n.href||'');
      const target=href.split('?')[0].split('#')[0];
      const isActive=target===current || (current==='index.html' && (target===''||target==='/'));
      const cls=(n.className||'')+(isActive?' active':'');
      return '<a class="'+cls.trim()+'" href="'+String(href).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+String(n.label||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</a>';
    }).join('');
  }catch(e){}
})();
</script>
</body></html>
