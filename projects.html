<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects | Simran Sainand Revankar</title>
<link rel="stylesheet" href="assets/research-readable.css?v=1">
<style>
.projects-page .projects-start{
  padding:72px 0 90px;
  border-top:1px solid var(--line)
}
.projects-page .projects-start .section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:35px;
  margin-bottom:30px
}
.projects-page .projects-start .section-head h2{
  margin:0;
  max-width:650px;
  font-size:clamp(2.9rem,4.6vw,4.4rem);
  line-height:.93
}
.projects-page .projects-start .section-head p{
  margin:0;
  max-width:560px;
  color:var(--muted);
  font-size:1rem
}
@media(max-width:720px){
  .projects-page .projects-start{padding:56px 0 68px}
  .projects-page .projects-start .section-head{display:grid;gap:12px}
}
</style>
</head>
<body class="projects-page">
<header class="site-header"><div class="wrap nav">
<a class="brand" href="index.html">Simran Sainand Revankar</a>
<nav class="nav-links">
<a class="active" href="projects.html">Projects</a>
<a href="blogs.html">Blogs</a>
<a href="publications.html">Publications</a>
<a href="media/docs/CV.pdf">CV ↗</a>
<a class="creative-link" href="creative.html">Creative side ↗</a>
</nav>
<a class="menu-note" href="creative.html">Creative side ↗</a>
</div></header>

<main>
<section class="projects-start">
  <div class="wrap">
    <div class="section-head">
      <div>
        <div class="eyebrow">Projects</div>
        <h2>Projects that carry the story forward.</h2>
      </div>
      <p>These are the two projects currently in the archive. Open either one for the question, approach and what the work taught me.</p>
    </div>
    <div class="project-grid" id="projectGrid"></div>
  </div>
</section>
</main>

<footer class="wrap site-footer"><span>Projects · work · learning</span></footer>
<script>
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('content/projects.json',{cache:'no-store'}).then(r=>r.json()).then(ps=>{
 document.getElementById('projectGrid').innerHTML=ps.map((p,i)=>'<a class="project-card reveal" href="project.html?slug='+encodeURIComponent(p.slug)+'"><div class="project-index">'+String(i+1).padStart(2,'0')+'</div><div class="body"><div class="status">'+esc(p.status)+'</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.summary)+'</p><div class="meta">Open project ↗</div></div></a>').join('');
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.1});
 document.querySelectorAll('.reveal').forEach(x=>io.observe(x));
});
</script>
</body></html>
