<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stories — Creative side</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eee8dc;--paper-2:#f5f0e7;--ink:#342b2b;--muted:#584d4d;
  --wine:#5e273b;--gold:#765a2d;--line:rgba(52,43,43,.16);
  --card:#e5ded2;--shadow:0 12px 28px rgba(52,43,43,.06);
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif;
}
body{
  margin:0;background:var(--paper);color:var(--ink);font:18px/1.75 var(--sans);padding:20px 5vw 70px;
}
.wrap{max-width:1240px;margin:0 auto}
.topline{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:10px}
.eyebrow{font-family:var(--sans);text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;color:var(--wine);font-weight:600}
.topnav{display:flex;gap:18px;font-size:.76rem;font-weight:700;text-transform:uppercase}
.topnav a{text-decoration:none;color:#4f3840;text-decoration:underline;text-underline-offset:4px}
.topnav a:hover{color:var(--wine)}
h1{font-family:var(--serif);font-size:clamp(3.6rem,7vw,6rem);line-height:.9;margin:30px 0 40px;font-weight:500}

/* Book Shelf Grid */
.book-shelf {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 24px;
}
.book-card {
  background: rgba(245,240,231,.62);
  border: 1px solid var(--line);
  padding: 24px;
  display: flex;
  gap: 20px;
  box-shadow: var(--shadow);
  text-decoration: none;
  color: inherit;
  transition: transform .2s ease;
}
.book-card:hover {
  transform: translateY(-3px);
}
.book-cover {
  width: 130px;
  height: 180px;
  object-fit: cover;
  flex-shrink: 0;
  border: 1px solid var(--line);
}
.book-details h2 {
  font-family: var(--serif);
  font-size: 2rem;
  margin: 6px 0 10px;
  line-height: 1;
}
.book-details p {
  font-size: .92rem;
  color: var(--muted);
  line-height: 1.5;
  margin: 0 0 15px;
}
.read-btn {
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--wine);
  text-decoration: underline;
  text-underline-offset: 4px;
}
@media(max-width:600px){
  .book-shelf{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="topline">
    <div class="eyebrow">Creative side</div>
    <nav class="topnav">
      <a href="index.html">Home</a>
      <a href="stories.html">Stories</a>
    </nav>
  </header>

  <h1>Writings & Stories.</h1>

  <div class="book-shelf">
    <!-- Book Item 1 -->
    <a href="stories/the-city-in-the-mist/index.html" class="book-card">
      <img src="stories/the-city-in-the-mist/cover.jpg" alt="Book Cover" class="book-cover">
      <div class="book-details">
        <div class="eyebrow">Fiction · Ongoing</div>
        <h2>The City in the Mist</h2>
        <p>An excerpt from a recurring dream about a railway platform that exists only on Tuesdays...</p>
        <span class="read-btn">Open book ↗</span>
      </div>
    </a>
  </div>
</main>
</body>
</html>
