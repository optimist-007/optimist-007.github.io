<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Travel Diaries — a small collection of beach visits and memories.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'none'">
<title>Travel Diaries · Creative Side</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eee8dc;--paper-light:#f5f0e7;--ink:#342b2b;--muted:#6c6060;
  --wine:#6a3044;--gold:#9b783d;--line:rgba(52,43,43,.17);
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif;--mono:"DM Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);font:16px/1.65 var(--sans);
  background:
    radial-gradient(circle at 14% 18%,rgba(155,120,61,.08),transparent 25%),
    radial-gradient(circle at 90% 8%,rgba(106,48,68,.06),transparent 24%),
    var(--paper);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.2;
  background-image:linear-gradient(rgba(52,43,43,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(52,43,43,.018) 1px,transparent 1px);
  background-size:26px 26px;
}
a{color:inherit}
.page{width:min(1120px,90vw);margin:0 auto;padding:24px 0 70px}
.topline{
  display:flex;justify-content:space-between;align-items:center;gap:18px;
  padding:0 0 13px;border-bottom:1px solid var(--line);
  font:500 .67rem var(--mono);letter-spacing:.12em;text-transform:uppercase;
}
.topline a{text-decoration:none;color:var(--muted)}
.topline a:hover{color:var(--wine)}
.hero{text-align:center;padding:clamp(44px,8vw,88px) 0 34px}
.kicker{font:500 .7rem var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--wine)}
.hero h1{
  margin:12px auto 12px;max-width:900px;
  font:500 clamp(3.2rem,8vw,6.5rem)/.88 var(--serif);
  letter-spacing:-.05em;
}
.hero-rule{width:116px;height:1px;background:var(--gold);margin:22px auto 0;position:relative}
.hero-rule:after{content:"";position:absolute;left:50%;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--wine);transform:translateX(-50%)}
.post{max-width:1050px;margin:0 auto}
.post-meta{
  display:flex;justify-content:center;flex-wrap:wrap;gap:10px 18px;margin:0 auto 18px;
  color:var(--muted);font:500 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;text-align:center;
}
.post h2{
  max-width:850px;margin:0 auto 12px;text-align:center;
  font:500 clamp(2.1rem,4.6vw,3.6rem)/.98 var(--serif);letter-spacing:-.035em;
}
.places{margin:0 auto 26px;text-align:center;color:var(--wine);font:500 .7rem var(--mono);letter-spacing:.14em;text-transform:uppercase}
.collage-frame{
  position:relative;margin:0;padding:clamp(8px,1.4vw,16px);
  background:rgba(245,240,231,.88);border:1px solid rgba(106,75,62,.25);
  box-shadow:0 22px 55px rgba(52,43,43,.1);
}
.collage-frame:before{content:"";position:absolute;inset:6px;border:1px solid rgba(155,120,61,.2);pointer-events:none}
.collage-frame img{display:block;width:100%;height:auto;object-fit:contain;position:relative;z-index:1}
figcaption{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:13px 2px 0;color:var(--muted);font-size:.84rem;
}
.post-note{
  max-width:720px;margin:35px auto 0;text-align:center;
  font:italic 1.25rem/1.55 var(--serif);color:#5c4b4c;
}
.bottom-nav{
  display:flex;justify-content:center;margin:50px auto 0;padding-top:18px;border-top:1px solid var(--line);
  font:500 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;
}
.bottom-nav a{color:var(--wine);text-decoration:none}
.bottom-nav a:hover{text-decoration:underline;text-underline-offset:4px}
@media(max-width:640px){
  .page{width:min(100% - 30px,1120px);padding-top:16px}
  .topline{font-size:.59rem}
  .hero{padding:48px 0 25px}
  .hero h1{font-size:clamp(2.9rem,14vw,4.5rem)}
  .post h2{font-size:2.4rem}
  .post-note{font-size:1.08rem;margin-top:24px}
  figcaption{font-size:.76rem}
}
</style>
</head>
<body>
<main class="page">
  <div class="topline">
    <a href="creative.html">← Creative Side</a>
    <span>Travel Diaries · 001</span>
  </div>

  <header class="hero">
    <div class="kicker">Travel diaries</div>
    <h1>Places, in pieces.</h1>
    <div class="hero-rule" aria-hidden="true"></div>
  </header>

  <article class="post">
    <div class="post-meta"><span>Travel note · 2026</span></div>
    <h2>My 2026 beach visits</h2>
    <p class="places">Mumbai · Goa · Kerala</p>
    <figure class="collage-frame">
      <img src="media/images/travel-diaries-beach-collage.webp" alt="A photo collage of 2026 beach visits, with memories labelled Mumbai, Goa and Kerala." loading="eager">
      <figcaption>
        <span>A little collection of beach memories.</span>
        <span>2026</span>
      </figcaption>
    </figure>
    <p class="post-note">A few places, a few shorelines, and memories collected along the way.</p>
  </article>

  <nav class="bottom-nav" aria-label="Page navigation">
    <a href="creative.html">← Back to Creative Side</a>
  </nav>
</main>
</body>
</html>
